<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.5" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#13091c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="0.5" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
    </pattern>
    <style>
      .pulse { animation: p 2.8s ease-in-out infinite; transform-origin:center; }
      .scan { animation: s 4s linear infinite; }
      .float { animation: f 5s ease-in-out infinite; }
      @keyframes p { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes s { from { transform:translateX(-40px)} to { transform:translateX(1440px)} }
      @keyframes f { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    </style>
  </defs>

  <rect width="1400" height="430" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="428" rx="28" fill="url(#grid)" stroke="#00f7ff" stroke-opacity=".25"/>

  <g opacity=".7" filter="url(#glow)">
    <circle cx="180" cy="90" r="2.5" fill="#00f7ff" class="pulse"/>
    <circle cx="1210" cy="120" r="2.5" fill="#ff4fd8" class="pulse"/>
    <circle cx="1100" cy="340" r="2.5" fill="#9b5cff" class="pulse"/>
    <circle cx="260" cy="330" r="2.5" fill="#00f7ff" class="pulse"/>
  </g>

  <path d="M90 335 C270 220 390 390 570 260 S920 150 1300 315" fill="none"
        stroke="url(#line)" stroke-width="2" opacity=".6"/>
  <path d="M90 335 C270 220 390 390 570 260 S920 150 1300 315" fill="none"
        stroke="url(#line)" stroke-width="8" opacity=".12" filter="url(#glow)"/>

  <g class="float" transform="translate(1060 62)">
    <rect width="250" height="105" rx="16" fill="#070a12" stroke="#00f7ff" stroke-opacity=".38"/>
    <text x="20" y="28" fill="#00f7ff" font-family="monospace" font-size="13">ENGINEERING LAB</text>
    <text x="20" y="56" fill="#fff" font-family="monospace" font-size="12">STATUS  ██████████  ONLINE</text>
    <text x="20" y="82" fill="#9b5cff" font-family="monospace" font-size="11">AI / SYSTEMS / PRODUCT</text>
  </g>

  <g transform="translate(88 72)">
    <text x="0" y="0" fill="#00f7ff" font-family="monospace" font-size="15" letter-spacing="5">VINEET BHATT // 2026</text>
    <text x="0" y="95" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">BUILDING</text>
    <text x="0" y="160" fill="url(#line)" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700">INTELLIGENT SYSTEMS</text>
    <text x="0" y="208" fill="#c9d3e3" font-family="monospace" font-size="19">AI  ×  SYSTEMS  ×  FULL-STACK  ×  PRODUCT</text>
  </g>

  <rect y="398" width="1400" height="2" fill="#00f7ff" opacity=".18"/>
  <rect y="398" width="240" height="2" fill="url(#line)" class="scan"/>
</svg>
